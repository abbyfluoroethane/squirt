[package]
license = "MIT"
name = "squirt"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
indicatif = "0.18.6"
lofty = "0.25.5"
serde = "1.0.229"
serde_json = "1.0.154"
squirt-library = { version = "0.1.0", path = "../squirt-library" }
squirt-mtp = { version = "0.1.0", path = "../squirt-mtp" }
squirt-player = { version = "0.1.0", path = "../squirt-player" }
squirt-service = { version = "0.1.0", path = "../squirt-service" }
tiny_http = "0.12.0"
