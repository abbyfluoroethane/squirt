# Checks and builds Squirt on every push and pull request.
#
# - check: svelte-check, the frontend build and the Rust tests (Linux).
# - ffmpeg: the LGPL sidecars (cached; see ffmpeg.yml).
# - build: release bundles for macOS (Apple silicon, Intel), Linux and
#   Windows, uploaded as workflow artifacts.
# - release: on a v* tag, a draft GitHub release with every bundle.
#
# Repository secrets compiled into the bundles:
# - SQUIRT_MTPZ_DATA: the MTPZ key file. Without it, users need ~/.mtpz-data.
# - SQUIRT_LASTFM_API_SECRET: without it, Last.fm sign-in is unavailable.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Frontend
        working-directory: app
        run: |
          npm ci
          npm run check
          npm run build
      - name: Rust tests
        run: cargo test --workspace --locked

  ffmpeg:
    uses: ./.github/workflows/ffmpeg.yml

  build:
    needs: [check, ffmpeg]
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 26 runners: Xcode 26 gives the app the current system look
          # (Liquid Glass controls) and compiles the layered Squirt.icon.
          - { os: macos-26, target: aarch64-apple-darwin, ffmpeg: aarch64-apple-darwin, bundles: 'dmg' }
          - { os: macos-26-intel, target: x86_64-apple-darwin, ffmpeg: x86_64-apple-darwin, bundles: 'dmg' }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ffmpeg: x86_64-unknown-linux-gnu, bundles: 'deb,rpm,appimage' }
          - { os: windows-2022, target: x86_64-pc-windows-msvc, ffmpeg: x86_64-pc-windows-gnu, bundles: 'msi,nsis' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux packages
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-${{ matrix.ffmpeg }}
          path: app/src-tauri/binaries
      - name: Sidecar names
        # The Windows ffmpeg is built with MinGW (static), the app with MSVC;
        # Tauri looks for sidecars named after the app's target.
        shell: bash
        run: |
          cd app/src-tauri/binaries
          if [ "${{ matrix.ffmpeg }}" != "${{ matrix.target }}" ]; then
            for b in ffmpeg ffprobe; do mv "$b-${{ matrix.ffmpeg }}.exe" "$b-${{ matrix.target }}.exe"; done
          fi
          chmod +x ffmpeg-* ffprobe-* || true
          ls -la
      - name: macOS icon
        # The layered icon (Squirt.icon) gives the Clear, Tinted and Dark Dock
        # icons. Tauri's own actool call crashes on it (Tauri CLI 2.12, Xcode
        # 26.6), so compile it here and give Tauri the finished Assets.car.
        if: startsWith(matrix.os, 'macos')
        working-directory: app/src-tauri
        run: |
          t="$(mktemp -d)"
          cp -R icons/Squirt.icon "$t/Icon.icon"
          mkdir "$t/out"
          xcrun actool "$t/Icon.icon" --compile "$t/out" --output-format human-readable-text --notices --warnings \
            --output-partial-info-plist "$t/out/info.plist" --app-icon Icon --include-all-app-icons \
            --enable-on-demand-resources NO --development-region en --target-device mac \
            --minimum-deployment-target 26.0 --platform macosx
          cp "$t/out/Assets.car" icons/Assets.car
          echo '{ "bundle": { "icon": ["icons/Assets.car", "icons/icon.icns"] } }' > tauri.macos-icon.conf.json
          echo "ICON_CONFIG=src-tauri/tauri.macos-icon.conf.json" >> "$GITHUB_ENV"
      - name: Build
        working-directory: app
        shell: bash
        env:
          SQUIRT_LASTFM_API_SECRET: ${{ secrets.SQUIRT_LASTFM_API_SECRET }}
          SQUIRT_MTPZ_DATA: ${{ secrets.SQUIRT_MTPZ_DATA }}
        run: |
          npm ci
          npx tauri build --config src-tauri/tauri.release.conf.json ${ICON_CONFIG:+--config "$ICON_CONFIG"} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v7
        with:
          name: squirt-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: squirt-*
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Artifacts keep their bundle folders (dist/dmg, dist/appimage...).
          find dist -type f -print0 | xargs -0 gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --draft --generate-notes --title "Squirt ${GITHUB_REF_NAME#v}"
