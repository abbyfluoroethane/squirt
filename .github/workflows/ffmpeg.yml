# Builds Squirt's minimal LGPL ffmpeg/ffprobe sidecars for each platform.
# Release builds download these artifacts into app/src-tauri/binaries and run
#   npx tauri build --config src-tauri/tauri.release.conf.json
name: ffmpeg sidecars

on:
  workflow_dispatch:
  push:
    paths: [scripts/build-ffmpeg.sh, .github/workflows/ffmpeg.yml]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-2022, target: x86_64-pc-windows-gnu }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ startsWith(matrix.os, 'windows') && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools (macOS Intel)
        if: matrix.target == 'x86_64-apple-darwin'
        run: brew install nasm
      - name: Tools (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y nasm build-essential
      - name: Tools (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            make diffutils tar xz curl mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm mingw-w64-x86_64-rust
      - name: Build
        run: scripts/build-ffmpeg.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: app/src-tauri/binaries/
