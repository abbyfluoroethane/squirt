# Builds Squirt's minimal LGPL ffmpeg/ffprobe sidecars for each platform.
# The build workflow calls this one; builds are cached per script version,
# so ffmpeg is only compiled again when scripts/build-ffmpeg.sh changes.
name: ffmpeg sidecars

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-2022, target: x86_64-pc-windows-gnu }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ startsWith(matrix.os, 'windows') && 'msys2 {0}' || 'bash' }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: app/src-tauri/binaries/
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Tools (macOS)
        if: steps.cache.outputs.cache-hit != 'true' && startsWith(matrix.os, 'macos')
        run: brew install nasm
      - name: Tools (Linux)
        if: steps.cache.outputs.cache-hit != 'true' && startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y nasm build-essential
      - name: Tools (Windows)
        if: steps.cache.outputs.cache-hit != 'true' && startsWith(matrix.os, 'windows')
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            make diffutils tar xz curl mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: app/src-tauri/binaries/
