[package]
name = "squirt-app"
version = "0.1.0"
description = "Squirt: music player, library manager and Zune sync"
authors = ["Abby Bigaouette"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "squirt_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
squirt-service = { path = "../../crates/squirt-service" }
