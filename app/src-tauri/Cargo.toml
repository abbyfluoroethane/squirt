[package]
name = "squirt-app"
version = "0.1.1"
description = "Squirt: music player, library manager and Zune sync"
authors = ["Abby Bigaouette"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "squirt_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = ["protocol-asset"] }
squirt-service = { path = "../../crates/squirt-service" }
# Media keys and the OS "now playing" panel. zbus keeps Linux builds free of libdbus.
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
