<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
	<!-- macOS fallback icon (.icns): Apple's icon grid, an 824pt squircle plate
	     in a 1024 canvas, with the folded drop. Used where the Icon Composer
	     icon (Squirt.icon) can't be: older macOS, or builds without Xcode 26. -->
	<defs>
		<linearGradient id="plate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdfbfa"/><stop offset="1" stop-color="#ece6e1"/></linearGradient>
		<filter id="plateShadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/></filter>
		<linearGradient id="pink" x1="0.15" y1="0" x2="0.85" y2="1"><stop offset="0" stop-color="#ff5cba"/><stop offset="1" stop-color="#d6007a"/></linearGradient>
		<linearGradient id="rose" x1="0.1" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#ff3d8a"/><stop offset="1" stop-color="#ff5a4a"/></linearGradient>
		<linearGradient id="orange" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#ff6a4a"/><stop offset="1" stop-color="#ffb21e"/></linearGradient>
		<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
		<filter id="cast" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#5c0030" flood-opacity="0.3"/></filter>
		<clipPath id="drop"><path d="M50 6 C50 6 18 44 18 64 A32 32 0 0 0 82 64 C82 44 50 6 50 6 Z"/></clipPath>
		<clipPath id="mid"><path d="M50 6 C50 6 18 44 18 64 A32 32 0 0 0 76.6 81.9 C66 72 62 58 66 44 C68 32 60 18 50 6 Z"/></clipPath>
	</defs>
	<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)" filter="url(#plateShadow)"/>
	<g transform="translate(512 512) scale(5.6) translate(-50 -51)" filter="url(#cast)">
		<path d="M50 6 C50 6 18 44 18 64 A32 32 0 0 0 82 64 C82 44 50 6 50 6 Z" fill="url(#orange)"/>
		<g clip-path="url(#drop)"><path d="M50 6 C50 6 18 44 18 64 A32 32 0 0 0 76.6 81.9 C66 72 62 58 66 44 C68 32 60 18 50 6 Z" transform="translate(4 2)" fill="#5c0030" opacity="0.38" filter="url(#soft)"/></g>
		<path d="M50 6 C50 6 18 44 18 64 A32 32 0 0 0 76.6 81.9 C66 72 62 58 66 44 C68 32 60 18 50 6 Z" fill="url(#rose)"/>
		<g clip-path="url(#mid)"><path d="M50 6 C50 6 18 44 18 64 A32 32 0 0 0 66.3 91.6 C52 80 46 62 55 42 C60 31 57 18 50 6 Z" transform="translate(4 2)" fill="#5c0030" opacity="0.38" filter="url(#soft)"/></g>
		<path d="M50 6 C50 6 18 44 18 64 A32 32 0 0 0 66.3 91.6 C52 80 46 62 55 42 C60 31 57 18 50 6 Z" fill="url(#pink)"/>
	</g>
</svg>
