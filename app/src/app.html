<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Set the theme before the first paint, so the page never flashes the
		     wrong colors. Same rule as $lib/theme.svelte.ts. -->
		<script>
			(function () {
				var t = 'system';
				try { t = localStorage.getItem('squirt.theme') || 'system'; } catch (e) {}
				var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				if (dark) document.documentElement.classList.add('dark');
			})();
		</script>
		<style>
			html { background: oklch(0.975 0 0); }
			html.dark { background: oklch(0.13 0 0); }
		</style>
		<link rel="preload" href="/fonts/selawik/selawkl.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/selawik/selawksl.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/selawik/selawk.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/selawik/selawksb.woff2" as="font" type="font/woff2" crossorigin />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
